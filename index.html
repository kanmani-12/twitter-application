<!doctype html>
<html>
  <head>
    <title>Mini Twitter</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="box">
      <h1>Mini Twitter</h1>

      <p>
        <b>My Profile</b><br />
        Followers: 120 &nbsp; Following: 80
      </p>

      <textarea id="postText" placeholder="What's happening?"></textarea>
      <br />

      <button onclick="post()">Post</button>

      <div class="post">
        <b class="profile" onclick="viewProfile('Rahul')"> Rahul </b>

        <p>Learning JavaScript today!</p>

        <button onclick="likePost(this)">♡ Like <span>0</span></button>

        <button onclick="follow(this)">Follow</button>

        <p>
          <b class="profile" onclick="viewProfile('Priya')"> Priya </b>: Nice
          post!
        </p>
      </div>

      <div id="newPost"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
