<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chirp — Sign in</title><link rel="stylesheet" href="style.css"></head><body><main class="login-page"><section class="login-card"><div class="login-mark" id="login-mark"></div><h1>Welcome back</h1><p>Sign in to catch up with your flock.</p><form class="login-form" onsubmit="login(event)"><label>Email<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></label><p id="login-error" class="login-error" aria-live="polite"></p><button class="primary">Sign in</button></form></section></main><script src="data.js"></script><script src="app.js"></script><script>document.querySelector('#login-mark').innerHTML=icon('home')</script></body></html>
